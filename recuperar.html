<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Amasanderia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1 flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <div class="text-4xl mb-2">🔑</div>
                    <h1 class="text-2xl font-bold text-amber-900">Recuperar Contraseña</h1>
                    <p class="text-amber-700 mt-1">Te enviaremos un enlace para restablecer tu contraseña</p>
                </div>

                <form id="recover-form" class="space-y-4">
                    <div>
                        <label class="block text-amber-800 font-medium mb-1">Email</label>
                        <input type="email" required class="w-full px-4 py-3 border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="tu@email.com">
                    </div>
                    <button type="submit" class="w-full bg-amber-800 text-white py-3 rounded-lg font-bold hover:bg-amber-900 transition-colors">Enviar Enlace</button>
                </form>

                <div class="mt-6 text-center">
                    <a href="login.html" class="text-amber-800 font-medium hover:underline">← Volver a Iniciar Sesión</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        document.getElementById('recover-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const result = Auth.recoverPassword(email);
            showToast(result.message, result.success ? 'success' : 'error');
            if (result.success) {
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
