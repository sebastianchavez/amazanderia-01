<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Amasanderia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">
    <div id="header"></div>

    <main class="flex-1 flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <div class="text-4xl mb-2">🍞</div>
                    <h1 class="text-2xl font-bold text-amber-900">Iniciar Sesión</h1>
                    <p class="text-amber-700 mt-1">Bienvenido de vuelta a Amasanderia</p>
                </div>

                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-amber-800 font-medium mb-1">Email</label>
                        <input type="email" required class="w-full px-4 py-3 border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="tu@email.com">
                    </div>
                    <div>
                        <label class="block text-amber-800 font-medium mb-1">Contraseña</label>
                        <input type="password" required class="w-full px-4 py-3 border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="Tu contraseña">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-amber-800 cursor-pointer">
                            <input type="checkbox" class="rounded text-amber-800">
                            <span class="text-sm">Recordarme</span>
                        </label>
                        <a href="recuperar.html" class="text-sm text-amber-800 hover:underline">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="w-full bg-amber-800 text-white py-3 rounded-lg font-bold hover:bg-amber-900 transition-colors">Iniciar Sesión</button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-amber-700">¿No tienes cuenta? <a href="registro.html" class="text-amber-800 font-bold hover:underline">Regístrate aquí</a></p>
                </div>

                <div class="mt-6 p-4 bg-amber-50 rounded-lg text-sm text-amber-700">
                    <p class="font-bold mb-1">Cuentas de prueba:</p>
                    <p>maria@example.com / password123</p>
                    <p>carlos@example.com / password123</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        updateNavAuth();

        if (Auth.isLoggedIn()) {
            window.location.href = 'perfil.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;
            const result = Auth.login(email, password);

            if (result.success) {
                showToast('¡Bienvenido ' + result.user.name + '!', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                showToast(result.message, 'error');
            }
        });
    </script>
</body>
</html>
